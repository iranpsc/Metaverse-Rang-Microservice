                  schema:
                    example: HM-2000000
                    type: string
                - description: |
                    Optional land-use filter. Accepted codes are a, m, t, g, s, b, e, n. Forms: karbari[]=m, karbari[0]=m, or repeated karbari=m. Privacy still applies: a code is included only when its privacy value is missing or 1. Omitted means all eight codes, then privacy. Hidden codes are dropped, not rejected.
                  in: query
                  name: karbari
                  required: false
                  schema:
                    example:
                        - m
                        - t
                    items:
                        type: string
                    type: array
            responses:
                "200":
                    content:
