                  name: feature
                  required: true
                  schema:
                    example: 1
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                coupon_code:
                                    description: Owner coupon for this feature. Omit to pay the full fee.
                                    example: OPENING-10
                                    type: string
                            type: object
                    multipart/form-data:
                        schema:
                            properties:
                                coupon_code:
                                    description: Owner coupon for this feature. Omit to pay the full fee.
                                    example: OPENING-10
                                    type: string
                            type: object
                description: Body may be omitted. A coupon applies only to the first paid entry of a 24-hour window.
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    message:
                                        example: entry successful
                                        type: string
                                type: object
                    description: entry successful. Re-entry inside an open window does not charge again.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unauthenticated
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: entry config not found, feature not found, building not found, or coupon not found
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LockedAccount'
                    description: Account security is locked. Wallet-login sessions are exempt.
                "412":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: |
                        entry is not active, building construction is not finished, user already inside this building, user level is outside the allowed scope, coupon usage limit reached, coupon discount does not reduce the fee, Insufficient balance, or payment outcome unknown.
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ObjectValidationError'
                    description: invalid feature ID or invalid request body
            security:
                - BearerAuth: []
            summary: Enter a building. A paid visit stays valid for 24 hours; exit and re-entry in that window do not charge again
            tags:
                - Features
    /api/features/{feature}/building/entry-config:
