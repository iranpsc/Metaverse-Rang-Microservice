            tags:
                - Features
        post:
            operationId: post_features_feature_building_entry-config
            parameters:
                - description: Feature ID. Caller must own the feature. The feature must already have a building.
                  in: path
                  name: feature
                  required: true
                  schema:
                    example: 1
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            description: |
                                Creates or updates the config. Omitted fields keep their previous values. The first save treats omitted fees as 0.00, omitted text as empty, and is_active as false. Send both level fields or neither.
                            properties:
                                about:
                                    example: Open 9 to 21
                                    maxLength: 1000
                                    type: string
                                fee_irr:
                                    description: IRR fee. Same rules as fee_psc.
                                    oneOf:
                                        - example: "50000.50"
                                          type: string
                                        - example: 50000.5
                                          type: number
                                fee_psc:
                                    description: PSC fee. Empty means 0.00. At most 2 decimal places. Response is always a two-decimal string.
                                    oneOf:
                                        - example: "10.00"
                                          type: string
                                        - example: 10
                                          type: number
                                is_active:
                                    description: Also accepts 1, 0, "true", "false", and "yes".
                                    oneOf:
                                        - example: true
                                          type: boolean
                                        - example: 1
                                          type: integer
                                        - example: "true"
                                          type: string
                                level_scope_type:
                                    description: exact (equal score), and_upper (score >= level), and_lower (score <= level). Empty with an empty level_slug means any level.
                                    enum:
                                        - ""
                                        - exact
                                        - and_upper
                                        - and_lower
                                    example: and_upper
                                    type: string
                                level_slug:
                                    description: Slug of a level. Required when level_scope_type is set.
                                    example: level-3
                                    type: string
                            type: object
                    multipart/form-data:
                        schema:
                            description: |
                                Creates or updates the config. Omitted fields keep their previous values. The first save treats omitted fees as 0.00, omitted text as empty, and is_active as false. Send both level fields or neither.
                            properties:
                                about:
                                    example: Open 9 to 21
                                    maxLength: 1000
                                    type: string
                                fee_irr:
                                    description: IRR fee. Same rules as fee_psc.
                                    oneOf:
                                        - example: "50000.50"
                                          type: string
                                        - example: 50000.5
                                          type: number
                                fee_psc:
                                    description: PSC fee. Empty means 0.00. At most 2 decimal places. Response is always a two-decimal string.
                                    oneOf:
                                        - example: "10.00"
                                          type: string
                                        - example: 10
                                          type: number
                                is_active:
                                    description: Also accepts 1, 0, "true", "false", and "yes".
                                    oneOf:
                                        - example: true
                                          type: boolean
                                        - example: 1
                                          type: integer
                                        - example: "true"
                                          type: string
                                level_scope_type:
                                    description: exact (equal score), and_upper (score >= level), and_lower (score <= level). Empty with an empty level_slug means any level.
                                    enum:
                                        - ""
                                        - exact
                                        - and_upper
                                        - and_lower
                                    example: and_upper
                                    type: string
                                level_slug:
                                    description: Slug of a level. Required when level_scope_type is set.
                                    example: level-3
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/BuildingEntryConfig'
                                type: object
                    description: Stored entry configuration. Fees are two-decimal strings.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unauthenticated
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: unauthorized - user does not own this feature
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: feature not found or building not found
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LockedAccount'
                    description: Account security is locked. Wallet-login sessions are exempt.
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ObjectValidationError'
                    description: invalid fee, about, level scope, or level_slug. request body is required.
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: Levels service is unavailable while a scope is set
            security:
                - BearerAuth: []
            summary: Set building entry fee (PSC and IRR), about text, level scope, and active flag
            tags:
                - Features
