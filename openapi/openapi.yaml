components:
    schemas:
        ApiError:
            properties:
                error:
                    description: Human-readable error message
                    type: string
            type: object
        BuildingCatalogModel:
            properties:
                attributes:
                    description: Catalog attributes. Slugs the client should read are length, width, and density.
                    items:
                        properties:
                            slug:
                                example: width
                                type: string
                            value:
                                description: Number or string from the catalog
                                example: 15
                        type: object
                    nullable: true
                    type: array
                file:
                    additionalProperties: true
                    description: Catalog file object, often including url
                    nullable: true
                    type: object
                id:
                    description: 3D catalog id
                    example: 1001
                    format: int64
                    type: integer
                images:
                    description: Parsed catalog JSON. Usually an array of objects with id and url.
                    items:
                        additionalProperties: true
                        type: object
                    nullable: true
                    type: array
                model_id:
                    description: Same id as a string. Use this value in build paths.
                    example: "1001"
                    type: string
                name:
                    example: Shop A
                    type: string
                required_satisfaction:
                    description: Minimum stake for this feature on the catalog response. On the placed-building list this is the stored model value, often "0".
                    example: "1.2000"
                    type: string
                sku:
                    example: SHOP-A
                    type: string
            type: object
        BuildingEntryConfig:
            properties:
                about:
                    example: Open 9 to 21
                    type: string
                feature_id:
                    example: 44
                    format: int64
                    type: integer
                fee_irr:
                    description: IRR fee with two decimal places. 0.00 means free.
                    example: "50000.00"
                    type: string
                fee_psc:
                    description: PSC fee with two decimal places. 0.00 means free.
                    example: "10.00"
                    type: string
                is_active:
                    example: true
                    type: boolean
                level_scope_type:
                    description: exact, and_upper, and_lower, or empty when any level may enter
                    example: and_upper
                    type: string
                level_slug:
                    example: level-3
                    type: string
            type: object
        BuildingEntryCoupon:
            properties:
                code:
                    example: OPENING-10
                    type: string
                discount_percentage:
                    example: 10
                    maximum: 100
                    minimum: 1
                    type: integer
                feature_id:
                    example: 44
                    format: int64
                    type: integer
                id:
                    example: 7
                    format: int64
                    type: integer
                real_usage_count:
                    description: How many times guests have used this coupon
                    example: 0
                    type: integer
                usage_count:
                    description: Maximum number of uses
                    example: 100
                    type: integer
            type: object
        BuildingInformation:
            description: Public building profile. Empty strings are omitted from responses.
            properties:
                activity_line:
                    description: ISIC activity code
                    example: "4711"
                    maxLength: 255
                    type: string
                address:
                    maxLength: 255
                    type: string
                description:
                    maxLength: 5000
                    type: string
                name:
                    example: Sample shop
                    maxLength: 255
                    type: string
                postal_code:
                    description: 10-digit Iranian postal code
                    example: "1234567890"
                    type: string
                website:
                    description: http or https URL
                    example: https://example.com
                    maxLength: 255
                    type: string
            type: object
        EmptyData:
            properties:
                data:
                    description: Empty object
                    type: object
            type: object
        Error:
            properties:
                message:
                    type: string
            type: object
        LockedAccount:
            properties:
                message:
                    example: Account security is locked. Unlock your account security to continue.
                    type: string
            type: object
        ObjectValidationError:
            properties:
                errors:
                    additionalProperties:
                        type: string
                    description: Field messages. Empty when the error is not tied to one field.
                    type: object
                message:
                    description: Text to show the user
                    type: string
            type: object
        PaginationLinks:
            properties:
                first:
                    nullable: true
                    type: string
                last:
                    nullable: true
                    type: string
                next:
                    nullable: true
                    type: string
                prev:
                    nullable: true
                    type: string
            type: object
        PaginationMeta:
            properties:
                current_page:
                    example: 1
                    type: integer
                from:
                    example: 1
                    nullable: true
                    type: integer
                last_page:
                    example: 1
                    type: integer
                path:
                    type: string
                per_page:
                    example: 10
                    type: integer
                to:
                    example: 10
                    nullable: true
                    type: integer
                total:
                    example: 0
                    type: integer
            type: object
        ValidationError:
            properties:
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                message:
                    type: string
            type: object
    securitySchemes:
        BearerAuth:
            bearerFormat: Token
            description: 'Bearer token. Header: Authorization: Bearer {token}'
            scheme: bearer
            type: http
