                  required: true
                  schema:
                    example: HM-2000000
                    type: string
                - description: |
                    Optional land-use filter. Accepted codes are a, m, t, g, s, b, e, n. Privacy still applies. Omitted means all eight codes, then privacy.
                  in: query
                  name: karbari
                  required: false
                  schema:
                    example:
                        - m
                    items:
                        type: string
                    type: array
                - description: |
                    daily (default, 24 hourly labels HH:mm), weekly (4 weeks, Jalali yyyy/MM/dd), monthly (12 months, Persian month and year), or yearly (Jalali years since registration). Any other value is treated as daily.
                  in: query
                  name: period
                  required: false
                  schema:
                    example: weekly
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            properties:
                                                amount:
                                                    description: Completed buildings in this bucket
                                                    example: 2
                                                    type: number
                                                karbari:
                                                    example: m
                                                    type: string
                                                label:
                                                    description: Bucket label. Format depends on period.
                                                    example: 1403/07/01
                                                    type: string
                                            type: object
                                        type: array
                                type: object
                    description: |
                        Flat series, oldest bucket first. For each karbari, one point per bucket. Group by karbari to draw one series. amount is buildings finished in that bucket.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unauthenticated
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: citizen not found
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                    description: Validation error
            summary: Completed buildings timeline chart for a period
            tags:
                - Citizen
