                                                                type: integer
                                                            url:
                                                                type: string
                                                        type: object
                                                    type: array
                                                karbari:
                                                    example: t
                                                    type: string
                                                visitors:
                                                    description: Always 0 until visitor tracking exists
                                                    example: 0
                                                    type: number
                                            type: object
                                        type: array
                                    links:
                                        $ref: '#/components/schemas/PaginationLinks'
                                    meta:
                                        $ref: '#/components/schemas/PaginationMeta'
                                type: object
                    description: Completed buildings. links and meta.path are absolute URLs for this request. from and to are null on an empty page.
