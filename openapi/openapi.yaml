                                    maxLength: 64
                                    minLength: 1
                                    pattern: ^[A-Za-z0-9_-]+$
                                    type: string
                                discount_percentage:
                                    description: Applied to both PSC and IRR. Integer only.
                                    example: 10
                                    maximum: 100
                                    minimum: 1
                                    type: integer
                                max_usage_count:
                                    description: Alias of usage_count. Ignored when usage_count is present.
                                    example: 100
                                    minimum: 1
                                    type: integer
                                usage_count:
                                    description: Maximum number of uses. max_usage_count is an accepted alias.
                                    example: 100
                                    minimum: 1
                                    type: integer
                            required:
                                - code
                                - discount_percentage
                                - usage_count
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/BuildingEntryCoupon'
                                type: object
                    description: Created coupon. usage_count is the maximum. real_usage_count starts at 0.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unauthenticated
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: unauthorized - user does not own this feature
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: building not found or feature not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: coupon code already exists
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LockedAccount'
                    description: Account security is locked. Wallet-login sessions are exempt.
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ObjectValidationError'
                    description: usage_count is required, discount_percentage is required, or a field is invalid
            security:
                - BearerAuth: []
            summary: Create a building entry discount coupon (code, discount percentage, usage count)
            tags:
                - Features
