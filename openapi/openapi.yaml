                                    minimum: 1
                                    type: integer
                                usage_count:
                                    description: Maximum number of uses. max_usage_count is an accepted alias.
                                    example: 100
                                    minimum: 1
                                    type: integer
                            required:
                                - code
                                - discount_percentage
                                - usage_count
                            type: object
                    multipart/form-data:
