                  in: path
                  name: feature
                  required: true
                  schema:
                    example: 1
                    format: int64
                    type: integer
                - description: Catalog model_id (the same value as the catalog id, as a string)
                  in: path
                  name: buildingModel
                  required: true
                  schema:
                    example: "1001"
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                activity_line:
                                    description: ISIC code. When set, the information fields are saved.
                                    maxLength: 255
                                    type: string
                                address:
                                    maxLength: 255
                                    type: string
                                description:
                                    maxLength: 5000
                                    type: string
                                information:
                                    $ref: '#/components/schemas/BuildingInformation'
                                    description: Optional nested form of the same information fields.
                                launched_satisfaction:
                                    description: Stake charged from the satisfaction wallet. Must be greater than 0 and at least the catalog required_satisfaction. A JSON number is accepted. Hours to finish = required_satisfaction * 288000 / launched_satisfaction.
                                    oneOf:
                                        - example: "1.2"
                                          type: string
                                        - example: 1.2
                                          type: number
                                name:
                                    description: Saved only when activity_line is set.
                                    maxLength: 255
                                    type: string
                                position:
                                    description: Placement as x,y
                                    example: 10.5,20
                                    pattern: ^(-?\d+(\.\d+)?),\s*(-?\d+(\.\d+)?)$
                                    type: string
                                postal_code:
                                    description: Iranian postal code, 10 digits. Persian digits, spaces, and dashes are accepted.
                                    example: "1234567890"
                                    type: string
                                rotation:
                                    description: Rotation in degrees. A JSON number is accepted.
                                    oneOf:
                                        - example: "90"
                                          type: string
                                        - example: 90
                                          type: number
                                website:
                                    description: http or https URL
                                    example: https://example.com
                                    maxLength: 255
                                    type: string
                            required:
                                - launched_satisfaction
                                - rotation
                                - position
                            type: object
                    multipart/form-data:
                        schema:
                            properties:
                                activity_line:
                                    description: ISIC code. When set, the information fields are saved.
                                    maxLength: 255
                                    type: string
                                address:
                                    maxLength: 255
                                    type: string
                                description:
                                    maxLength: 5000
                                    type: string
                                information:
                                    $ref: '#/components/schemas/BuildingInformation'
                                    description: Optional nested form of the same information fields.
                                launched_satisfaction:
                                    description: Stake charged from the satisfaction wallet. Must be greater than 0 and at least the catalog required_satisfaction. A JSON number is accepted. Hours to finish = required_satisfaction * 288000 / launched_satisfaction.
                                    oneOf:
                                        - example: "1.2"
                                          type: string
                                        - example: 1.2
                                          type: number
                                name:
                                    description: Saved only when activity_line is set.
                                    maxLength: 255
                                    type: string
                                position:
                                    description: Placement as x,y
                                    example: 10.5,20
                                    pattern: ^(-?\d+(\.\d+)?),\s*(-?\d+(\.\d+)?)$
                                    type: string
                                postal_code:
                                    description: Iranian postal code, 10 digits. Persian digits, spaces, and dashes are accepted.
                                    example: "1234567890"
                                    type: string
                                rotation:
                                    description: Rotation in degrees. A JSON number is accepted.
                                    oneOf:
                                        - example: "90"
                                          type: string
                                        - example: 90
                                          type: number
                                website:
                                    description: http or https URL
                                    example: https://example.com
                                    maxLength: 255
                                    type: string
                            required:
                                - launched_satisfaction
                                - rotation
                                - position
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EmptyData'
                    description: Construction started. The building is not returned; list buildings on the feature.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unauthenticated
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: unauthorized - user does not own this feature
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LockedAccount'
                    description: Account security is locked. Wallet-login sessions are exempt.
                "412":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiError'
                    description: feature already has a building, or insufficient satisfaction
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ObjectValidationError'
                    description: Invalid stake, rotation, position, or building information. request body is required.
            security:
                - BearerAuth: []
