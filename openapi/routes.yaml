              $ref: "#/components/schemas/ApiError"
  - path: /api/features/{feature}/building/entry-coupons
    methods: [post]
    tag: Features
    summary: Create a building entry discount coupon (code, discount percentage, usage count)
    security: bearer
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID. Caller must own the feature. The feature must already have a building.
        example: 1
    body:
      type: object
      required: [code, discount_percentage, usage_count]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
          example: OPENING-10
        discount_percentage:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied to both PSC and IRR. Integer only.
          example: 10
        usage_count:
          type: integer
          minimum: 1
          description: Maximum number of uses. max_usage_count is an accepted alias.
          example: 100
        max_usage_count:
          type: integer
          minimum: 1
          description: Alias of usage_count. Ignored when usage_count is present.
          example: 100
    responses:
      "200":
        description: Created coupon. usage_count is the maximum. real_usage_count starts at 0.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/BuildingEntryCoupon"
      "403":
        description: unauthorized - user does not own this feature
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "404":
        description: building not found or feature not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "409":
        description: coupon code already exists
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "410":
        description: Account security is locked. Wallet-login sessions are exempt.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockedAccount"
      "422":
        description: usage_count is required, discount_percentage is required, or a field is invalid
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectValidationError"
