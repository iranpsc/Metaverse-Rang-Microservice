        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockedAccount"
  - path: /api/features/{feature}/build/buildings/{buildingModel}
    methods: [patch]
    tag: Features
    summary: Patch building information and return updated information
    security: bearer
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID. Caller must own the feature.
        example: 1
      - name: buildingModel
        in: path
        type: string
        description: Catalog model_id of the building on this feature
        example: "1001"
      - name: _method
        in: query
        type: string
        description: Send POST with _method=PATCH to call this route. Also accepted as a form field.
        example: PATCH
    body:
      type: object
      description: >
        Send one or more information fields at the top level or under information.
        Only non-empty strings are applied. An empty string does not clear a stored value.
        At least one field must remain after the merge.
      properties:
        activity_line:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 255
        postal_code:
          type: string
          description: 10-digit Iranian postal code
          example: "1234567890"
        website:
          type: string
          maxLength: 255
          description: http or https URL
        description:
          type: string
          maxLength: 5000
        information:
          $ref: "#/components/schemas/BuildingInformation"
    responses:
      "200":
        description: Merged information. Empty fields are omitted.
        content:
          application/json:
            schema:
              type: object
              properties:
                information:
                  $ref: "#/components/schemas/BuildingInformation"
      "403":
        description: unauthorized - user does not own this feature
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "404":
        description: building not found or building model not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "410":
        description: Account security is locked. Wallet-login sessions are exempt.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockedAccount"
      "422":
        description: information is required, or a field failed validation
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectValidationError"
  - path: /api/features/{feature}/building/entry-config
    methods: [post]
    tag: Features
    summary: Set building entry fee (PSC and IRR), about text, level scope, and active flag
    security: bearer
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID. Caller must own the feature. The feature must already have a building.
        example: 1
    body:
      type: object
      description: >
        Creates or updates the config. Omitted fields keep their previous values.
        The first save treats omitted fees as 0.00, omitted text as empty, and is_active as false.
        Send both level fields or neither.
      properties:
        fee_psc:
          description: PSC fee. Empty means 0.00. At most 2 decimal places. Response is always a two-decimal string.
          oneOf:
            - type: string
              example: "10.00"
            - type: number
              example: 10
        fee_irr:
          description: IRR fee. Same rules as fee_psc.
          oneOf:
            - type: string
              example: "50000.50"
            - type: number
              example: 50000.5
        about:
          type: string
          maxLength: 1000
          example: Open 9 to 21
        level_scope_type:
          type: string
          description: exact (equal score), and_upper (score >= level), and_lower (score <= level). Empty with an empty level_slug means any level.
          enum: ["", exact, and_upper, and_lower]
          example: and_upper
        level_slug:
          type: string
          description: Slug of a level. Required when level_scope_type is set.
          example: level-3
        is_active:
          description: Also accepts 1, 0, "true", "false", and "yes".
          oneOf:
            - type: boolean
              example: true
            - type: integer
              example: 1
            - type: string
              example: "true"
    responses:
      "200":
        description: Stored entry configuration. Fees are two-decimal strings.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/BuildingEntryConfig"
      "403":
        description: unauthorized - user does not own this feature
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "404":
        description: feature not found or building not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "410":
        description: Account security is locked. Wallet-login sessions are exempt.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockedAccount"
      "422":
        description: invalid fee, about, level scope, or level_slug. request body is required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectValidationError"
      "503":
        description: Levels service is unavailable while a scope is set
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
  - path: /api/features/{feature}/building/entry-config
    methods: [get]
    tag: Features
    summary: Get building entry configuration
    security: bearer
    params:
      - name: feature
        in: path
        type: integer
        format: int64
