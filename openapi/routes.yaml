              $ref: "#/components/schemas/ApiError"
  - path: /api/features/{feature}/building/enter
    methods: [post]
    tag: Features
    summary: Enter a building. A paid visit stays valid for 24 hours; exit and re-entry in that window do not charge again
    security: bearer
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID. Owner enters free. Guests pay when entry is active and construction is finished.
        example: 1
    body:
      required: false
      description: Body may be omitted. A coupon applies only to the first paid entry of a 24-hour window.
      schema:
        type: object
        properties:
          coupon_code:
            type: string
            description: Owner coupon for this feature. Omit to pay the full fee.
            example: OPENING-10
    responses:
      "200":
        description: entry successful. Re-entry inside an open window does not charge again.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: entry successful
      "404":
        description: entry config not found, feature not found, building not found, or coupon not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "410":
        description: Account security is locked. Wallet-login sessions are exempt.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockedAccount"
      "412":
        description: >
          entry is not active, building construction is not finished, user already inside this building,
          user level is outside the allowed scope, coupon usage limit reached,
          coupon discount does not reduce the fee, Insufficient balance, or payment outcome unknown.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "422":
        description: invalid feature ID or invalid request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectValidationError"
  - path: /api/features/{feature}/building/exit
