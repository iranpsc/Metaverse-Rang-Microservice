# Path and query parameters are auto-discovered from service HTTP handlers when available.
# Run `make openapi` to regenerate openapi/openapi.yaml from this file + handler discovery.
#
# Request JSON uses `body`. A map with `type` is the schema and the body is required.
# Wrap it when the body may be omitted:
#   body:
#     required: false
#     schema: { type: object, properties: { ... } }
# `responses` replaces the default 200, 401, and 422 entries for the same status code.

routes:
  # --- Auth ---
  - path: /api/auth/register
    methods: [post]
    tag: Auth
    summary: Start OAuth registration flow
    security: guest
  - path: /api/auth/redirect
    methods: [get]
    tag: Auth
    summary: Redirect to OAuth provider
    security: guest
  - path: /api/auth/callback
    methods: [get]
    tag: Auth
    summary: OAuth callback handler
    security: none
  - path: /api/auth/validate
    methods: [post]
    tag: Auth
    summary: Validate bearer token
    security: none
  - path: /api/auth/me
    methods: [get]
    tag: Auth
    summary: Get authenticated user profile
    security: bearer
  - path: /api/auth/logout
    methods: [post]
    tag: Auth
    summary: Log out current user
    security: bearer

  # --- Account Security ---
  - path: /api/account/security
    methods: [post]
    tag: Account Security
    summary: Request account security verification
    security: bearer
  - path: /api/account/security/verify
    methods: [post]
    tag: Account Security
    summary: Verify account security code
    security: bearer

  # --- Mobile ---
  - path: /api/mobile/send
    methods: [post]
    tag: Mobile
    summary: Send verification code to change mobile number
    security: bearer
  - path: /api/mobile/verify
    methods: [post]
    tag: Mobile
    summary: Verify code and change mobile number
    security: bearer

  # --- Wallet (Web3) ---
  - path: /api/wallet/link/nonce
    methods: [get]
    tag: Wallet
    summary: Get wallet link nonce
    security: bearer
  - path: /api/wallet/link
    methods: [post]
    tag: Wallet
    summary: Link Web3 wallet to account
    security: bearer
  - path: /api/wallet/security/nonce
    methods: [get]
    tag: Wallet
    summary: Get wallet security nonce
    security: bearer
  - path: /api/wallet/security/verify
    methods: [post]
    tag: Wallet
    summary: Verify wallet security signature
    security: bearer
  - path: /api/wallets/registered
    methods: [post]
    tag: Wallet
    summary: Check if a wallet address is already registered
    security: none

  # --- Users ---
  - path: /api/users
    methods: [get]
    tag: Users
    summary: List users
    security: optional
  - path: /api/user
    methods: [get]
    tag: Users
    summary: Get user by query parameter
    security: optional
  - path: /api/user/wallet
    methods: [get]
    tag: Users
    summary: Get authenticated user wallet
    security: bearer
  - path: /api/user/profile
    methods: [put, patch]
    tag: Users
    summary: Update authenticated user profile
    security: bearer
  - path: /api/user/{code}/level
    methods: [get]
    tag: Users
    summary: Get user level by citizen code
    security: none
    params:
      - name: code
        in: path
        type: string
        description: Citizen code
        example: HM-2000000
  - path: /api/users/{user}
    methods: [get]
    tag: Users
    summary: Get user profile by ID or code
    security: optional
  - path: /api/users/{user}/features
    methods: [get]
    tag: Users
    summary: List user features
    security: optional
  - path: /api/users/{user}/followers
    methods: [get]
    tag: Users
    summary: List user followers
    security: optional
  - path: /api/users/{user}/following
    methods: [get]
    tag: Users
    summary: List users followed by user
    security: optional

  # --- Citizen ---
  - path: /api/citizen/{code}
    methods: [get]
    tag: Citizen
    summary: Get citizen public profile
    security: none
  - path: /api/citizen/{code}/features/summary
    methods: [get]
    tag: Citizen
    summary: Per-karbari feature summary cards (current, bought, sold) for a period
    security: none
    params:
      - name: code
        in: path
        type: string
        description: Citizen code
        example: HM-2000000
      - name: period
        in: query
        type: string
        description: Time window for bought/sold counts (`daily`, `weekly`, `monthly`, or `yearly`). Defaults to `daily`.
        example: weekly
      - name: karbari
        in: query
        type: array
        description: Optional filter to specific karbari codes (e.g. `t`, `m`, `a`). Privacy settings still apply.
        example: [t, m]
  - path: /api/citizen/{code}/features/chart
    methods: [get]
    tag: Citizen
    summary: Bought vs sold feature timeline chart for a period
    security: none
    params:
      - name: code
        in: path
        type: string
        description: Citizen code
        example: HM-2000000
      - name: period
        in: query
        type: string
        description: Time window (`daily`, `weekly`, `monthly`, or `yearly`). Defaults to `daily`.
        example: weekly
      - name: karbari
        in: query
        type: array
        description: Optional filter to specific karbari codes. Privacy settings still apply.
        example: [t]
  - path: /api/citizen/{code}/features
    methods: [get]
    tag: Citizen
    summary: Paginated searchable feature list with map markers
    security: none
    params:
      - name: code
        in: path
        type: string
        description: Citizen code
        example: HM-2000000
      - name: karbari
        in: query
        type: array
        description: Optional filter to specific karbari codes (affects list and map markers). Privacy settings still apply.
        example: [t]
      - name: search
        in: query
        type: string
        description: Optional search by feature properties ID or address (affects list/count only, not map markers)
        example: TO111
      - name: page
        in: query
        type: integer
        description: Page number
        example: 1
      - name: per_page
        in: query
        type: integer
        description: Items per page (default 15)
        example: 15

  - path: /api/citizen/{code}/buildings/summary
    methods: [get]
    tag: Citizen
    summary: Per-karbari completed building count summary cards
    security: none
    params:
      - name: code
        in: path
        type: string
        description: Citizen code
        example: HM-2000000
      - name: karbari
        in: query
        type: array
        description: >
          Optional land-use filter. Accepted codes are a, m, t, g, s, b, e, n.
          Forms: karbari[]=m, karbari[0]=m, or repeated karbari=m.
          Privacy still applies: a code is included only when its privacy value is missing or 1.
          Omitted means all eight codes, then privacy. Hidden codes are dropped, not rejected.
        example: [m, t]
    responses:
      "200":
        description: One row per allowed karbari, in request order. Count 0 is included. Empty data when every code is hidden.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      karbari:
                        type: string
                        description: Land-use code (a, m, t, g, s, b, e, n)
                        example: m
                      label:
                        type: string
                        description: Persian label for karbari
                        example: مسکونی
                      count:
                        type: integer
                        description: Completed buildings of this karbari
                        example: 4
      "404":
        description: citizen not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
  - path: /api/citizen/{code}/buildings/chart
    methods: [get]
    tag: Citizen
    summary: Completed buildings timeline chart for a period
    security: none
    params:
      - name: code
        in: path
        type: string
        description: Citizen code
        example: HM-2000000
      - name: period
        in: query
        type: string
        description: >
          daily (default, 24 hourly labels HH:mm), weekly (4 weeks, Jalali yyyy/MM/dd),
          monthly (12 months, Persian month and year), or yearly (Jalali years since registration).
          Any other value is treated as daily.
        example: weekly
      - name: karbari
        in: query
        type: array
        description: >
          Optional land-use filter. Accepted codes are a, m, t, g, s, b, e, n.
          Privacy still applies. Omitted means all eight codes, then privacy.
        example: [m]
    responses:
      "200":
        description: >
          Flat series, oldest bucket first. For each karbari, one point per bucket.
          Group by karbari to draw one series. amount is buildings finished in that bucket.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      karbari:
                        type: string
                        example: m
                      label:
                        type: string
                        description: Bucket label. Format depends on period.
                        example: "1403/07/01"
                      amount:
                        type: number
                        description: Completed buildings in this bucket
                        example: 2
      "404":
        description: citizen not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
  - path: /api/citizen/{code}/buildings
    methods: [get]
    tag: Citizen
    summary: Paginated list of completed buildings (10 per page)
    security: none
    params:
      - name: code
        in: path
        type: string
        description: Citizen code
        example: HM-2000000
      - name: karbari
        in: query
        type: array
        description: >
          Optional land-use filter. Accepted codes are a, m, t, g, s, b, e, n.
          Privacy still applies. Omitted means all eight codes, then privacy.
        example: [m]
      - name: page
        in: query
        type: integer
        description: Page number (default 1, 10 items per page)
        example: 1
    responses:
      "200":
        description: Completed buildings. links and meta.path are absolute URLs for this request. from and to are null on an empty page.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      building_id:
                        type: string
                        description: Building model SKU
                        example: SHOP-A
                      karbari:
                        type: string
                        example: t
                      area:
                        type: number
                        nullable: true
                        description: length times width from model attributes
                        example: 300
                      visitors:
                        type: number
                        description: Always 0 until visitor tracking exists
                        example: 0
                      empty_units:
                        type: number
                        description: Always 0 until unit tracking exists
                        example: 0
                      density:
                        type: number
                        nullable: true
                        description: Density attribute from the building model
                        example: 2
                      construction_end_date:
                        type: string
                        nullable: true
                        description: Jalali date yyyy/MM/dd
                        example: "1403/08/09"
                      images:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: 0 when the catalog stored a bare URL
                            url:
                              type: string
                links:
                  $ref: "#/components/schemas/PaginationLinks"
                meta:
                  $ref: "#/components/schemas/PaginationMeta"
      "404":
        description: citizen not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"

  - path: /api/citizen/{code}/wallet/history/summary
    methods: [get]
    tag: Citizen
    summary: Citizen wallet asset history summary cards
    security: none
    params:
      - name: code
        in: path
        type: string
        description: Citizen code
        example: HM-2000000
      - name: period
        in: query
        type: string
        description: Required time window (`daily`, `weekly`, `monthly`, or `yearly`)
        example: weekly
      - name: assets
        in: query
        type: array
        description: Optional filter by asset names (`psc`, `irr`, `red`, `blue`, `yellow`, `satisfaction`, `effect`)
        example: [psc, irr]
  - path: /api/citizen/{code}/wallet/history/chart
    methods: [get]
    tag: Citizen
    summary: Citizen wallet asset history income/spending chart
    security: none
    params:
      - name: code
        in: path
        type: string
        description: Citizen code
        example: HM-2000000
      - name: period
        in: query
        type: string
        description: Required time window (`daily`, `weekly`, `monthly`, or `yearly`)
        example: weekly
      - name: assets
        in: query
        type: array
        description: Optional filter by asset names
        example: [psc]

  # --- Search ---
  - path: /api/search/users
    methods: [get]
    tag: Search
    summary: Search users
    security: optional
  - path: /api/search/features
    methods: [get]
    tag: Search
    summary: Search features
    security: optional
  - path: /api/search/isic-codes
    methods: [get]
    tag: Search
    summary: Search ISIC codes
    security: optional

  # --- KYC ---
  - path: /api/kyc
    methods: [get, put, patch]
    tag: KYC
    summary: Get or update KYC information
    security: bearer
  - path: /api/bank-accounts
    methods: [get, post]
    tag: KYC
    summary: List or create bank accounts
    security: verified_email
  - path: /api/bank-accounts/{id}
    methods: [get, put, patch, delete]
    tag: KYC
    summary: Manage a bank account
    security: verified_email

  # --- Personal Info ---
  - path: /api/personal-info
    methods: [get, put, patch]
    tag: Personal Info
    summary: Get or update personal information
    security: bearer

  # --- Profile Limitations ---
  - path: /api/profile-limitations
    methods: [post]
    tag: Profile
    summary: Create profile limitation
    security: bearer
  - path: /api/profile-limitations/{id}
    methods: [put, patch, delete]
    tag: Profile
    summary: Update or delete profile limitation
    security: bearer
  - path: /api/users/{user}/profile-limitations
    methods: [get]
    tag: Profile
    summary: Get mutual profile limitation between caller and user
    security: bearer

  # --- Profile Photos ---
  - path: /api/profile-photos
    methods: [get, post]
    tag: Profile
    summary: List or upload profile photos
    security: bearer
  - path: /api/profile-photos/{id}
    methods: [get, delete]
    tag: Profile
    summary: Get or delete profile photo
    security: bearer

  # --- Settings ---
  - path: /api/settings
    methods: [get, post]
    tag: Settings
    summary: Get or update user settings
    security: bearer
  - path: /api/general-settings
    methods: [get]
    tag: Settings
    summary: Get general settings
    security: bearer
  - path: /api/general-settings/{key}
    methods: [put]
    tag: Settings
    summary: Update general setting
    security: bearer
  - path: /api/privacy
    methods: [get, post]
    tag: Settings
    summary: Get or update privacy settings
    security: bearer

  # --- User Events ---
  - path: /api/events
    methods: [get]
    tag: Events
    summary: List user events
    security: bearer
  - path: /api/events/{id}
    methods: [get]
    tag: Events
    summary: Get user event
    security: bearer
  - path: /api/events/{id}/report/{user}
    methods: [post]
    tag: Events
    summary: Report user event
    security: bearer

  # --- Calendar ---
  - path: /api/calendar
    methods: [get]
    tag: Calendar
    summary: List calendar events
    security: optional
  - path: /api/calendar/{id}
    methods: [get]
    tag: Calendar
    summary: Get calendar event
    security: optional
  - path: /api/calendar/filter
    methods: [get]
    tag: Calendar
    summary: Filter calendar events by date range
    security: optional
  - path: /api/calendar/latest-version
    methods: [get]
    tag: Calendar
    summary: Get latest calendar version
    security: optional
  - path: /api/calendar/events/{id}/interactions
    methods: [post]
    tag: Calendar
    summary: Add calendar event interaction
    security: bearer

  # --- Dynasty ---
  - path: /api/dynasty
    methods: [get]
    tag: Dynasty
    summary: Get user dynasty or available features
    security: bearer
  - path: /api/dynasty/create/{feature}
    methods: [post]
    tag: Dynasty
    summary: Create dynasty with feature
    security: bearer
  - path: /api/dynasty/{dynasty}/update/{feature}
    methods: [post]
    tag: Dynasty
    summary: Update dynasty feature
    security: bearer
  - path: /api/dynasty/{dynasty}/family/{family}
    methods: [get]
    tag: Dynasty
    summary: Get dynasty family
    security: bearer
  - path: /api/dynasty/requests/sent
    methods: [get]
    tag: Dynasty
    summary: List sent join requests
    security: bearer
  - path: /api/dynasty/requests/sent/{joinRequest}
    methods: [get, delete]
    tag: Dynasty
    summary: View or delete sent join request
    security: bearer
  - path: /api/dynasty/requests/recieved
    methods: [get]
    tag: Dynasty
    summary: List received join requests
    security: bearer
  - path: /api/dynasty/requests/recieved/{joinRequest}
    methods: [get, post, delete]
    tag: Dynasty
    summary: View, accept, or reject received join request
    security: bearer
  - path: /api/dynasty/add/member/get/permissions
    methods: [post]
    tag: Dynasty
    summary: Get default member permissions
    security: bearer
  - path: /api/dynasty/add/member
    methods: [post]
    tag: Dynasty
    summary: Send dynasty join request
    security: bearer
  - path: /api/dynasty/search
    methods: [post]
    tag: Dynasty
    summary: Search users for dynasty
    security: bearer
  - path: /api/dynasty/prizes
    methods: [get]
    tag: Dynasty
    summary: List dynasty prizes
    security: bearer
  - path: /api/dynasty/prizes/{recievedPrize}
    methods: [get, post]
    tag: Dynasty
    summary: View or claim dynasty prize
    security: bearer
  - path: /api/dynasty/children/{user}
    methods: [post]
    tag: Dynasty
    summary: Update child permissions
    security: bearer

  # --- Features ---
  - path: /api/features
    methods: [get]
    tag: Features
    summary: List features
    security: optional
  - path: /api/features/buildings/completed
    methods: [get]
    tag: Features
    summary: List construction-completed buildings (paginated, 10 per page)
    security: none
    params:
      - name: page
        in: query
        type: integer
        description: Page number (default 1, 10 items per page)
        example: 1
    responses:
      "200":
        description: Buildings whose construction end date is in the past. links are relative paths. length, width, and density are null when the model has no such attribute.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        example: 12
                      feature_id:
                        type: integer
                        format: int64
                        example: 44
                      feature_properties_id:
                        type: string
                        description: Uppercased feature properties id
                        example: TO111
                      length:
                        type: string
                        nullable: true
                        example: "20"
                      width:
                        type: string
                        nullable: true
                        example: "15"
                      density:
                        type: string
                        nullable: true
                        example: "2"
                      karbari:
                        type: string
                        example: t
                links:
                  $ref: "#/components/schemas/PaginationLinks"
                meta:
                  $ref: "#/components/schemas/PaginationMeta"
  - path: /api/isic-codes
    methods: [get]
    tag: Features
    summary: List ISIC codes (paginated, 10 per page; optional search by name or code)
    security: optional
    params:
      - name: page
        in: query
        type: integer
        description: Page number for pagination
      - name: search
        in: query
        type: string
        description: Optional filter by ISIC code name or numeric code
  - path: /api/features/{id}
    methods: [get]
    tag: Features
    summary: Get feature details
    security: optional
    params:
      - name: id
        in: path
        type: integer
        format: int64
        description: Feature ID
        example: 1
  - path: /api/features/{feature}/trade-history
    methods: [get]
    tag: Features
    summary: Get feature trade history
    security: none
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID
        example: 1
      - name: page
        in: query
        type: integer
        description: Page number for pagination
  - path: /api/features/{feature}/sell-requests
    methods: [get]
    tag: Features
    summary: List sell requests for a feature (newest first)
    security: none
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID
        example: 1
  - path: /api/features/{feature}/build/package
    methods: [get]
    tag: Features
    summary: List 3D building models that can be built on a feature
    security: bearer
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID. Caller must own the feature.
        example: 1
      - name: page
        in: query
        type: integer
        description: Catalog page forwarded to the 3D API. Default 1. Request the next page until data is empty. This response has no links or meta.
        example: 1
    responses:
      "200":
        description: Catalog page for this feature. required_satisfaction is the minimum stake for this feature, as a 4-decimal string.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/BuildingCatalogModel"
                feature:
                  type: object
                  properties:
                    coordinates:
                      type: array
                      description: Feature polygon coordinates
                      items:
                        type: string
                      example: ["51.3890,35.6892"]
      "403":
        description: unauthorized - user does not own this feature
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "422":
        description: invalid feature ID
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectValidationError"
  - path: /api/features/{feature}/build/{buildingModel}
    methods: [post]
    tag: Features
    summary: Start construction of one building on a feature
    security: bearer
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID. Caller must own the feature. The feature must not already have a building.
        example: 1
      - name: buildingModel
        in: path
        type: string
        description: Catalog model_id (the same value as the catalog id, as a string)
        example: "1001"
    body:
      type: object
      required: [launched_satisfaction, rotation, position]
      properties:
        launched_satisfaction:
          description: Stake charged from the satisfaction wallet. Must be greater than 0 and at least the catalog required_satisfaction. A JSON number is accepted. Hours to finish = required_satisfaction * 288000 / launched_satisfaction.
          oneOf:
            - type: string
              example: "1.2"
            - type: number
              example: 1.2
        rotation:
          description: Rotation in degrees. A JSON number is accepted.
          oneOf:
            - type: string
              example: "90"
            - type: number
              example: 90
        position:
          type: string
          description: Placement as x,y
          pattern: '^(-?\d+(\.\d+)?),\s*(-?\d+(\.\d+)?)$'
          example: "10.5,20"
        activity_line:
          type: string
          maxLength: 255
          description: ISIC code. When set, the information fields are saved.
        name:
          type: string
          maxLength: 255
          description: Saved only when activity_line is set.
        address:
          type: string
          maxLength: 255
        postal_code:
          type: string
          description: Iranian postal code, 10 digits. Persian digits, spaces, and dashes are accepted.
          example: "1234567890"
        website:
          type: string
          maxLength: 255
          description: http or https URL
          example: https://example.com
        description:
          type: string
          maxLength: 5000
        information:
          $ref: "#/components/schemas/BuildingInformation"
          description: Optional nested form of the same information fields.
    responses:
      "200":
        description: Construction started. The building is not returned; list buildings on the feature.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyData"
      "403":
        description: unauthorized - user does not own this feature
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "410":
        description: Account security is locked. Wallet-login sessions are exempt.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockedAccount"
      "412":
        description: feature already has a building, or insufficient satisfaction
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "422":
        description: Invalid stake, rotation, position, or building information. request body is required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectValidationError"
  - path: /api/features/{feature}/build/buildings
    methods: [get]
    tag: Features
    summary: List buildings on a feature
    security: optional
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID
        example: 1
    responses:
      "200":
        description: >
          Buildings on the feature. information is the parsed JSON object for the owner
          and null for everyone else. Dates are Jalali yyyy/MM/dd HH:mm:ss.
          required_satisfaction here is the stored model value, often "0"; use the catalog for the stake.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/BuildingCatalogModel"
                      - type: object
                        properties:
                          building:
                            type: object
                            properties:
                              model_id:
                                type: string
                                example: "1001"
                              feature_id:
                                type: integer
                                format: int64
                                example: 44
                              construction_start_date:
                                type: string
                                description: Jalali yyyy/MM/dd HH:mm:ss
                                example: "1403/08/09 14:30:45"
                              construction_end_date:
                                type: string
                                description: Jalali yyyy/MM/dd HH:mm:ss
                                example: "1403/09/01 08:00:00"
                              launched_satisfaction:
                                type: string
                                description: Staked satisfaction, 4 decimal places
                                example: "1.2000"
                              information:
                                nullable: true
                                allOf:
                                  - $ref: "#/components/schemas/BuildingInformation"
                                description: Null unless the caller owns the feature
                              rotation:
                                type: string
                                example: "90"
                              position:
                                type: string
                                example: "10.5,20"
                              bubble_diameter:
                                type: string
                                description: perimeter * (1 + 0.3 * (density - 1)), where perimeter = 2 * (width + length). "0" when attributes are missing.
                                example: "161"
      "422":
        description: invalid feature ID
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectValidationError"
  - path: /api/features/{feature}/build/buildings/{buildingModel}
    methods: [put]
    tag: Features
    summary: Update building stake, placement, and optional information
    security: bearer
    params:
      - name: feature
        in: path
        type: integer
        format: int64
        description: Feature ID. Caller must own the feature.
        example: 1
      - name: buildingModel
        in: path
        type: string
        description: Catalog model_id of the building on this feature
        example: "1001"
      - name: _method
        in: query
        type: string
        description: Send POST with _method=PUT to call this route. Also accepted as a form field.
        example: PUT
    body:
      type: object
      required: [launched_satisfaction, rotation, position]
      description: >
        Same fields as start construction. Raising launched_satisfaction charges the difference.
        Lowering it refunds the difference and must stay at least required_satisfaction.
        construction_end_date is recalculated from the original start.
        Information is replaced only when activity_line is non-empty.
      properties:
        launched_satisfaction:
          oneOf:
            - type: string
              example: "1.2"
            - type: number
              example: 1.2
        rotation:
          oneOf:
            - type: string
              example: "90"
            - type: number
              example: 90
        position:
          type: string
          pattern: '^(-?\d+(\.\d+)?),\s*(-?\d+(\.\d+)?)$'
          example: "10.5,20"
        activity_line:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 255
        postal_code:
          type: string
          example: "1234567890"
        website:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        information:
          $ref: "#/components/schemas/BuildingInformation"
    responses:
      "200":
        description: Building updated. Body is an empty data object.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyData"
      "403":
        description: unauthorized - user does not own this feature
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "404":
        description: building not found or building model not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "410":
        description: Account security is locked. Wallet-login sessions are exempt.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockedAccount"
      "412":
        description: insufficient satisfaction for an increased stake
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiError"
      "422":
        description: Invalid stake, rotation, position, or building information
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectValidationError"
  - path: /api/features/{feature}/build/buildings/{buildingModel}
