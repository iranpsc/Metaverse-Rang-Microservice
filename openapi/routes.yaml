# Shared response objects referenced by the buildings routes above.
schemas:
  EmptyData:
    type: object
    properties:
      data:
        type: object
        description: Empty object
  BuildingInformation:
    type: object
    description: Public building profile. Empty strings are omitted from responses.
    properties:
      activity_line:
        type: string
        maxLength: 255
        description: ISIC activity code
        example: "4711"
      name:
        type: string
        maxLength: 255
        example: Sample shop
      address:
        type: string
        maxLength: 255
      postal_code:
        type: string
        description: 10-digit Iranian postal code
        example: "1234567890"
      website:
        type: string
        maxLength: 255
        description: http or https URL
        example: https://example.com
      description:
        type: string
        maxLength: 5000
  BuildingCatalogModel:
    type: object
    properties:
      id:
        type: integer
        format: int64
        description: 3D catalog id
        example: 1001
      model_id:
        type: string
        description: Same id as a string. Use this value in build paths.
        example: "1001"
      name:
        type: string
        example: Shop A
      sku:
        type: string
        example: SHOP-A
      images:
        nullable: true
        description: Parsed catalog JSON. Usually an array of objects with id and url.
        type: array
        items:
          type: object
          additionalProperties: true
      attributes:
        nullable: true
        description: Catalog attributes. Slugs the client should read are length, width, and density.
        type: array
        items:
          type: object
          properties:
            slug:
              type: string
              example: width
            value:
              description: Number or string from the catalog
              example: 15
      file:
        nullable: true
        type: object
        description: Catalog file object, often including url
        additionalProperties: true
      required_satisfaction:
        type: string
        description: Minimum stake for this feature on the catalog response. On the placed-building list this is the stored model value, often "0".
        example: "1.2000"
  BuildingEntryConfig:
    type: object
    properties:
      feature_id:
        type: integer
        format: int64
        example: 44
      fee_psc:
        type: string
        description: PSC fee with two decimal places. 0.00 means free.
        example: "10.00"
      fee_irr:
        type: string
        description: IRR fee with two decimal places. 0.00 means free.
        example: "50000.00"
      about:
        type: string
        example: Open 9 to 21
      level_scope_type:
        type: string
        description: exact, and_upper, and_lower, or empty when any level may enter
        example: and_upper
      level_slug:
        type: string
        example: level-3
      is_active:
        type: boolean
        example: true
  BuildingEntryCoupon:
    type: object
    properties:
      id:
        type: integer
        format: int64
        example: 7
      feature_id:
        type: integer
        format: int64
        example: 44
      code:
        type: string
        example: OPENING-10
      discount_percentage:
        type: integer
        minimum: 1
        maximum: 100
        example: 10
      usage_count:
        type: integer
        description: Maximum number of uses
        example: 100
      real_usage_count:
        type: integer
        description: How many times guests have used this coupon
        example: 0
