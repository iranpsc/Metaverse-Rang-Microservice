name: Service CI (Reusable)

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      enable_deploy:
        required: false
        type: boolean
        default: true
      enable_test:
        required: false
        type: boolean
        default: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      KUBE_CONFIG:
        required: false
      CODECOV_TOKEN:
        required: false

env:
  DOCKER_REGISTRY: abbasajorloo
  GO_VERSION_FILE: services/${{ inputs.service_name }}/go.mod
  GOLANGCI_LINT_VERSION: v2.9.0
  GOVULNCHECK_VERSION: v1.1.4

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            services/${{ inputs.service_name }}/go.sum
            shared/go.sum
            tests/${{ inputs.service_name }}/go.sum

      - name: Verify dependencies
        run: |
          cd services/${{ inputs.service_name }}
          go mod download
          go mod verify

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: services/${{ inputs.service_name }}
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    if: inputs.enable_test

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: metarang_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: metarang_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: |
            services/${{ inputs.service_name }}/go.sum
            shared/go.sum
            tests/${{ inputs.service_name }}/go.sum

      - name: Setup test database
        uses: ./.github/actions/setup-test-db

      - name: Initialize test report
        run: |
          {
            echo "# Test Results: ${{ inputs.service_name }}"
            echo ""
            echo "Package-level checklist with failed tests expanded."
            echo ""
            echo "## Detailed Results"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        id: unit_tests
        env:
          # Unit suites stay in the summary table only; details are for tests/<service>.
          CHECKLIST_WRITE_SUMMARY: "false"
        run: |
          # ./... covers internal/, cmd/, and in-module tests/ (e.g. levels-service/tests).
          # Most services keep the bulk of tests in tests/<service>/ (next step).
          bash .github/scripts/go-test-checklist.sh \
            "Unit Tests (services/${{ inputs.service_name }}/...)" \
            "services/${{ inputs.service_name }}" \
            -- ./... -race -cover -coverprofile=coverage-unit.out -covermode=atomic

      # Keep later suites running after a failure so the checklist is complete.
      # Prefer if: always() over continue-on-error so failed steps stay red.
      # Do not gate with hashFiles(): in reusable workflows it can evaluate empty and
      # silently skip the external test modules where most tests actually live.
      - name: Run integration tests
        id: integration_tests
        if: always() && !cancelled()
        env:
          GOWORK: off
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          TEST_MOD="tests/${SERVICE_NAME}/go.mod"

          if [ ! -f "$TEST_MOD" ]; then
            orphan_count="$(find "tests/${SERVICE_NAME}" -name '*_test.go' 2>/dev/null | wc -l | tr -d ' ')"
            {
              echo ""
              echo "### Integration Tests (tests/${SERVICE_NAME}/...)"
              echo ""
              if [ "${orphan_count:-0}" -gt 0 ]; then
                echo "- [ ] ⚠️ Found ${orphan_count} \`*_test.go\` file(s) but no \`go.mod\` — cannot run as a module"
                echo "::warning::tests/${SERVICE_NAME} has test files without go.mod; add a go.mod to run them in CI"
              else
                echo "- [x] Skipped — no \`tests/${SERVICE_NAME}/go.mod\`"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=ran" >> "$GITHUB_OUTPUT"
          # Scope coverpkg to the service module only. A broad pattern like
          # metarang/<service>/... also matches tests/<service> packages such as
          # metarang/<service>/tests/internal/testutil and breaks coverage collection.
          COVERPKG="$(cd "services/${SERVICE_NAME}" && go list ./... | paste -sd, -)"
          bash .github/scripts/go-test-checklist.sh \
            "Integration Tests (tests/${SERVICE_NAME}/...)" \
            "tests/${SERVICE_NAME}" \
            -- ./... -race -cover -coverprofile=coverage-integration.out -covermode=atomic \
               -coverpkg="${COVERPKG}"

      - name: Install govulncheck
        if: always() && !cancelled()
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        id: govulncheck
        if: always() && !cancelled()
        run: |
          bash .github/scripts/govulncheck-checklist.sh \
            "Security Scan (govulncheck)" \
            "services/${{ inputs.service_name }}"

      - name: Report coverage
        id: coverage
        if: always() && !cancelled()
        run: |
          SERVICE="${{ inputs.service_name }}"
          MERGED="services/${SERVICE}/coverage.out"
          UNIT="services/${SERVICE}/coverage-unit.out"
          INTEGRATION="tests/${SERVICE}/coverage-integration.out"

          bash .github/scripts/go-coverage-summary.sh \
            "Code Coverage (${SERVICE})" \
            "$MERGED" \
            "$UNIT" \
            "$INTEGRATION"

          if [ -f "$MERGED" ] && [ -s "$MERGED" ]; then
            total="$(go tool cover -func="$MERGED" | tail -1 | grep -oE '[0-9]+\.[0-9]+%' | tail -1 || true)"
            echo "total=${total:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "total=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Finalize test checklist
        if: always() && !cancelled()
        run: |
          unit_outcome="${{ steps.unit_tests.outcome }}"
          integration_outcome="${{ steps.integration_tests.outcome }}"
          integration_status_flag="${{ steps.integration_tests.outputs.status }}"
          vuln_outcome="${{ steps.govulncheck.outcome }}"
          coverage_total="${{ steps.coverage.outputs.total }}"

          case "$unit_outcome" in
            success) unit_status="✅ Passed" ;;
            skipped) unit_status="⏭️ Skipped" ;;
            *) unit_status="❌ Failed" ;;
          esac

          if [ "$integration_status_flag" = "skipped" ]; then
            integration_status="⏭️ Not configured"
          elif [ "$integration_outcome" = "success" ]; then
            integration_status="✅ Passed"
          elif [ -z "$integration_outcome" ] || [ "$integration_outcome" = "skipped" ]; then
            integration_status="⏭️ Not configured"
          else
            integration_status="❌ Failed"
          fi

          case "$vuln_outcome" in
            success) vuln_status="✅ Passed" ;;
            skipped|"") vuln_status="⏭️ Skipped" ;;
            *) vuln_status="❌ Failed" ;;
          esac

          {
            echo ""
            echo "## Summary"
            echo ""
            echo "| Test suite | Status |"
            echo "|------------|--------|"
            echo "| Unit tests | ${unit_status} |"
            echo "| Integration tests | ${integration_status} |"
            echo "| govulncheck | ${vuln_status} |"
            echo "| Statement coverage | ${coverage_total} |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          [ "$unit_outcome" = "success" ] || failed=1
          if [ "$integration_status_flag" = "ran" ] && [ "$integration_outcome" != "success" ]; then
            failed=1
          fi
          if [ "$integration_status_flag" != "skipped" ] && [ "$integration_status_flag" != "ran" ]; then
            # Step failed before writing status (e.g. checklist script failed).
            if [ "$integration_outcome" != "success" ] && [ "$integration_outcome" != "skipped" ] && [ -n "$integration_outcome" ]; then
              failed=1
            fi
          fi
          [ "$vuln_outcome" = "success" ] || [ "$vuln_outcome" = "skipped" ] || [ -z "$vuln_outcome" ] || failed=1
          exit "$failed"

      - name: Upload coverage to Codecov
        if: always() && !cancelled() && steps.coverage.outputs.total != 'unknown'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./services/${{ inputs.service_name }}/coverage.out
          flags: ${{ inputs.service_name }}
          name: ${{ inputs.service_name }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always() && needs.lint.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ inputs.service_name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./services/${{ inputs.service_name }}/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,scope=${{ inputs.service_name }},mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ inputs.service_name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: inputs.enable_deploy && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure kubectl
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5.0.1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Ensure Docker registry pull secret
        run: |
          kubectl create secret docker-registry dockerhub-credentials \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKER_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
            -n metarang \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply cluster configuration
        run: |
          kubectl apply -f k8s/config/configmap.yaml
          MANIFEST="k8s/${{ inputs.service_name }}/deployment.yaml"
          if [ -f "$MANIFEST" ]; then
            kubectl apply -f "$MANIFEST"
          fi

      - name: Recover stuck deployment
        run: |
          NS=metarang
          DEPLOY="${{ inputs.service_name }}"
          REASON=$(kubectl get deployment "$DEPLOY" -n "$NS" \
            -o jsonpath='{.status.conditions[?(@.type=="Progressing")].reason}' 2>/dev/null || true)
          if [ "$REASON" = "ProgressDeadlineExceeded" ]; then
            echo "Deployment $DEPLOY is stuck; clearing failed pods before image update..."
            kubectl delete pods -l app="$DEPLOY" -n "$NS" --field-selector=status.phase!=Running --ignore-not-found
            kubectl rollout restart "deployment/$DEPLOY" -n "$NS"
            kubectl rollout status "deployment/$DEPLOY" -n "$NS" --timeout=3m || true
          fi

      - name: Update deployment image
        run: |
          kubectl set image deployment/${{ inputs.service_name }} \
            ${{ inputs.service_name }}=${{ env.DOCKER_REGISTRY }}/${{ inputs.service_name }}:${{ github.sha }} \
            -n metarang

      - name: Verify rollout
        run: kubectl rollout status deployment/${{ inputs.service_name }} -n metarang --timeout=5m

      - name: Verify pod readiness
        run: |
          # Only watch Running pods; terminating pods can disappear mid-wait and
          # cause kubectl wait to fail with NotFound during rolling updates.
          kubectl wait --for=condition=ready pod \
            -l app=${{ inputs.service_name }} \
            -n metarang \
            --field-selector=status.phase=Running \
            --timeout=120s

      - name: Rollback on failure
        if: failure()
        run: |
          NS=metarang
          DEPLOY="${{ inputs.service_name }}"
          kubectl describe deployment "$DEPLOY" -n "$NS" || true
          kubectl get pods -l app="$DEPLOY" -n "$NS" -o wide || true
          for POD in $(kubectl get pods -l app="$DEPLOY" -n "$NS" -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- logs: $POD ---"
            kubectl logs "$POD" -n "$NS" --tail=50 || true
          done
          kubectl rollout undo deployment/"$DEPLOY" -n "$NS" || true
          kubectl rollout status deployment/"$DEPLOY" -n "$NS" --timeout=5m || true
