name: Shared Packages CI

on:
  push:
    paths:
      - 'shared/**'
      - '.github/workflows/shared-packages.yml'
      - '.github/scripts/**'
    branches:
      - main
      - dev
  pull_request:
    paths:
      - 'shared/**'
      - '.github/workflows/shared-packages.yml'
      - '.github/scripts/**'
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-shared:
    name: Test Shared Packages
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: metarang_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: shared/go.mod
          cache-dependency-path: shared/go.sum

      - name: Install dependencies
        run: |
          cd shared
          go mod download
          go mod verify

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0
          working-directory: shared
          args: --timeout=5m

      - name: Initialize test report
        run: |
          {
            echo "# Test Results: Shared Packages"
            echo ""
            echo "Package-level checklist with failed tests expanded."
            echo ""
            echo "## Detailed Results"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        id: unit_tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: metarang_test
          DB_USER: root
          DB_PASSWORD: root_password
        run: |
          bash .github/scripts/go-test-checklist.sh \
            "Shared Package Tests (shared/pkg/...)" \
            "shared" \
            -- ./pkg/... ./cmd/... -race -cover -coverprofile=coverage-unit.out -covermode=atomic

      # Keep later suites running after a failure so the checklist is complete.
      # Prefer if: always() over continue-on-error so failed steps stay red.
      - name: Install govulncheck
        if: always() && !cancelled()
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        id: govulncheck
        if: always() && !cancelled()
        run: |
          bash .github/scripts/govulncheck-checklist.sh \
            "Security Scan (govulncheck)" \
            "shared"

      - name: Report coverage
        id: coverage
        if: always() && !cancelled()
        run: |
          bash .github/scripts/go-coverage-summary.sh \
            "Code Coverage (shared packages)" \
            "shared/coverage.out" \
            "shared/coverage-unit.out"

          if [ -f shared/coverage.out ] && [ -s shared/coverage.out ]; then
            total="$(go tool cover -func=shared/coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+%' | tail -1 || true)"
            echo "total=${total:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "total=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Finalize test checklist
        if: always() && !cancelled()
        run: |
          unit_outcome="${{ steps.unit_tests.outcome }}"
          vuln_outcome="${{ steps.govulncheck.outcome }}"
          coverage_total="${{ steps.coverage.outputs.total }}"

          case "$unit_outcome" in
            success) unit_status="✅ Passed" ;;
            *) unit_status="❌ Failed" ;;
          esac

          case "$vuln_outcome" in
            success) vuln_status="✅ Passed" ;;
            skipped|"") vuln_status="⏭️ Skipped" ;;
            *) vuln_status="❌ Failed" ;;
          esac

          {
            echo ""
            echo "## Summary"
            echo ""
            echo "| Test suite | Status |"
            echo "|------------|--------|"
            echo "| Shared package tests | ${unit_status} |"
            echo "| govulncheck | ${vuln_status} |"
            echo "| Statement coverage | ${coverage_total} |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          [ "$unit_outcome" = "success" ] || failed=1
          [ "$vuln_outcome" = "success" ] || [ "$vuln_outcome" = "skipped" ] || [ -z "$vuln_outcome" ] || failed=1
          exit "$failed"

      - name: Upload coverage
        if: always() && !cancelled() && steps.coverage.outputs.total != 'unknown'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./shared/coverage.out
          flags: shared
          name: shared-packages
          fail_ci_if_error: false
