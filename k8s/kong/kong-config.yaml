_format_version: "3.0"

services:
  # Auth Service (HTTP REST — migrated off grpc-gateway)
  - name: auth-service
    url: http://auth-service.metarang.svc.cluster.local:8066
    protocol: http
    routes:
      - name: auth-api
        paths:
          - /api/auth
          - /api/account
          - /api/wallet
          - /api/wallets
          - /api/users
          - /api/user/wallet
          - /api/user/profile
          - ~/api/user/[^/]+/level$
          - ~/api/user$
          - /api/search
          - /api/kyc
          - /api/bank-accounts
          - /api/personal-info
          - /api/profile-limitations
          - /api/profilePhotos
          - /api/profile-photos
          - /api/settings
          - /api/general-settings
          - /api/privacy
          - /api/events
          - /api/citizen
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              credentials: true
              max_age: 3600
          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              policy: local

  # Financial Service (HTTP REST — migrated off grpc-gateway)
  - name: financial-service
    url: http://financial-service.metarang.svc.cluster.local:8065
    protocol: http
    routes:
      - name: order-create
        paths:
          - /api/order
        methods:
          - POST
        strip_path: false
        plugins:
          - name: cors
          - name: rate-limiting
            config:
              minute: 10
              hour: 100
              policy: local

      - name: payment-callback
        paths:
          - /api/order/callback
          - /api/payment/callback
        methods:
          - POST
          - GET
        strip_path: false
        plugins:
          - name: cors

      - name: store-packages
        paths:
          - /api/store
        methods:
          - POST
        strip_path: false
        plugins:
          - name: cors
          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              policy: local

  # Commercial Service (HTTP REST — migrated off grpc-gateway; user wallet balance stays on auth-service HTTP)
  - name: commercial-service
    url: http://commercial-service.metarang.svc.cluster.local:8067
    protocol: http
    routes:
      - name: user-transactions
        paths:
          - /api/user/transactions
        methods:
          - GET
        strip_path: false
        plugins:
          - name: cors
          - name: rate-limiting
            config:
              minute: 120
              hour: 2000
              policy: local

      - name: citizen-wallet-history
        paths:
          - ~/api/citizen/[^/]+/wallet/history
        methods:
          - GET
        strip_path: false
        plugins:
          - name: cors
          - name: rate-limiting
            config:
              minute: 120
              hour: 2000
              policy: local

  # Support Service (HTTP REST — migrated off grpc-gateway)
  - name: support-service
    url: http://support-service.metarang.svc.cluster.local:8070
    protocol: http
    routes:
      - name: support-api
        paths:
          - /api/tickets
          - /api/reports
          - /api/notes
          - /api/support
        strip_path: false
        plugins:
          - name: cors
          - name: rate-limiting
            config:
              minute: 60
              hour: 1000
              policy: local

  # Storage Service — uploads + public upload API
  - name: storage-service
    url: http://storage-service.metarang.svc.cluster.local:8059
    protocol: http
    routes:
      - name: uploads-static
        paths:
          - /uploads
        methods:
          - GET
          - HEAD
          - OPTIONS
        strip_path: false
      - name: storage-upload
        paths:
          - /api/upload
        methods:
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          - name: cors

  # Prometheus metrics (required for Grafana golden signals / API traffic dashboards)
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  # Global rate limiting
  - name: rate-limiting
    config:
      minute: 1000
      hour: 10000
      policy: local
  
  # Global logging
  - name: file-log
    config:
      path: /tmp/kong-requests.log
      
  # Request/Response logging
  - name: http-log
    config:
      http_endpoint: http://logstash.metarang.svc.cluster.local:8080
      method: POST
      timeout: 1000
      keepalive: 1000

