routes:
  # Static files from storage-service
  - name: uploads-static
    service: storage-uploads
    paths:
      - /uploads
    strip_path: false
    preserve_host: false
    regex_priority: 100
    protocols:
      - http
      - https
    methods:
      - GET
      - HEAD
      - OPTIONS

  # Public file upload — storage-service only.
  # Exempt from rate-limiting: chunked uploads send one request per chunk.
  - name: storage-upload
    service: storage-uploads
    paths:
      - /api/upload
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - POST
      - OPTIONS

  # Calendar API
  - name: calendar-api
    service: calendar-service
    paths:
      - /api/calendar
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Levels API — higher priority than catch-all /api → grpc-gateway
  - name: levels-api
    service: levels-service
    paths:
      - /api/levels
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Features API — higher priority than catch-all /api → grpc-gateway.
  # Include OPTIONS so preflight always matches this route (PATCH must be allowed).
  # Kong CORS (priority 2000) answers OPTIONS before rate-limiting (901).
  - name: features-api
    service: features-service
    paths:
      - /api/features
      - /api/isic-codes
      - /api/my-features
      - /api/buy-requests
      - /api/sell-requests
      - /api/hourly-profits
      - /api/maps
      - ~/api/citizen/[^/]+/features
      - ~/api/citizen/[^/]+/buildings
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Notifications API — higher priority than catch-all /api → grpc-gateway
  - name: notifications-api
    service: notifications-service
    paths:
      - /api/notifications
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Social API — higher priority than catch-all /api → grpc-gateway
  - name: social-api
    service: social-service
    paths:
      - /api/followers
      - /api/following
      - /api/follow
      - /api/unfollow
      - /api/remove
      - /api/challenge
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Financial API — higher priority than catch-all /api → grpc-gateway
  - name: financial-api
    service: financial-service
    paths:
      - /api/order
      - /api/store
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Commercial API — higher priority than catch-all /api → grpc-gateway
  # and higher than auth-api for /api/citizen/*/wallet/history/*
  - name: commercial-api
    service: commercial-service
    paths:
      - /api/user/transactions
      - ~/api/citizen/[^/]+/wallet/history
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Dynasty API — higher priority than catch-all /api → grpc-gateway
  - name: dynasty-api
    service: dynasty-service
    paths:
      - /api/dynasty
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - DELETE
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Training API — higher priority than catch-all /api → grpc-gateway
  - name: training-api
    service: training-service
    paths:
      - /api/tutorials
      - /api/video-tutorials
      - /api/comments
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Auth API
  # /api/user/transactions* and /api/citizen/*/wallet/history* are routed by commercial-api (priority 98).
  # /api/citizen/* features/buildings subpaths are routed by features-api (priority 98).
  - name: auth-api
    service: auth-service
    paths:
      - /api/auth
      - /api/account
      - /api/wallet
      - /api/wallets
      - /api/users
      - /api/user/wallet
      - /api/user/profile
      - ~/api/user/[^/]+/level$
      - ~/api/user$
      - /api/search
      - /api/kyc
      - /api/bank-accounts
      - /api/personal-info
      - /api/profile-limitations
      - /api/profilePhotos
      - /api/profile-photos
      - /api/settings
      - /api/general-settings
      - /api/privacy
      - /api/events
      - /api/citizen
    strip_path: false
    preserve_host: false
    regex_priority: 97
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # Support API — tickets, reports, notes
  - name: support-api
    service: support-service
    paths:
      - /api/tickets
      - /api/reports
      - /api/notes
      - /api/support
    strip_path: false
    preserve_host: false
    regex_priority: 98
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
            ssl: false
            ssl_verify: false

  # OpenAPI documentation (Swagger UI) — catch-all at /; lower priority than /api and /uploads
  - name: api-docs
    service: swagger-ui
    paths:
      - /
    strip_path: true
    preserve_host: false
    protocols:
      - http
      - https
    methods:
      - GET
      - HEAD
      - OPTIONS
    regex_priority: 10

plugins:
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
  - name: cors
    config:
      # Exact origins + PCRE for local Vite/dev (localhost and 127.0.0.1, any port).
      # credentials:true forbids Origin:* — Kong must echo a matching origin.
      origins:
        - https://world.metarang.com
        - https://metarang.com
        - https://admin.metarang.com
        - https://dev-reactjs.metarang.com
        - https://dev-nextjs.metarang.com
        - http://localhost:5173
        - http://localhost:5175
        - 'http://localhost:\d+'
        - 'http://127\.0\.0\.1:\d+'
      methods:
        - GET
        - HEAD
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Language
        - Content-Language
        - Content-Type
        - Authorization
        - X-Requested-With
        - Origin
        - X-Request-Id
        - X-CSRF-TOKEN
        - X-XSRF-TOKEN
        - X-Locale
        - sentry-trace
        - baggage
        - traceparent
        - tracestate
      exposed_headers:
        - X-Auth-Token
      credentials: true
      # Keep short so browsers do not stick to a stale preflight that omitted PATCH.
      max_age: 60
      # Kong answers OPTIONS; do not proxy preflight to upstream (avoids ACAO:* clash).
      preflight_continue: false
