x-sentry-environment: &sentry-environment
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

x-internal-auth: &internal-auth
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-metarang-local-dev-service-secret-change-in-production}

x-grpc-tls: &grpc-tls
  GRPC_TLS_ENABLED: ${GRPC_TLS_ENABLED:-false}
  GRPC_TLS_CERT_FILE: ${GRPC_TLS_CERT_FILE:-/certs/grpc/server.crt}
  GRPC_TLS_KEY_FILE: ${GRPC_TLS_KEY_FILE:-/certs/grpc/server.key}
  GRPC_TLS_CA_FILE: ${GRPC_TLS_CA_FILE:-/certs/grpc/ca.crt}
  GRPC_TLS_CLIENT_CERT_FILE: ${GRPC_TLS_CLIENT_CERT_FILE:-/certs/grpc/client.crt}
  GRPC_TLS_CLIENT_KEY_FILE: ${GRPC_TLS_CLIENT_KEY_FILE:-/certs/grpc/client.key}

# Container path /certs/grpc (populated by grpc-certs-init into the grpc_certs volume)
x-grpc-certs-mount: &grpc-certs-mount grpc_certs:/certs:ro

x-grpc-certs-depends: &grpc-certs-depends
  grpc-certs-init:
    condition: service_completed_successfully

# DB-backed services wait for the one-shot migrate job before accepting traffic.
x-migrate-depends: &migrate-depends
  migrate:
    condition: service_completed_successfully

# Shared MySQL credentials (Dokploy env / local .env). Go services keep DB_HOST=mysql
# on metarang-network; the admin panel reaches this instance as metarang-mysql on metarang-shared.
x-db-environment: &db-environment
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-metarang_db}
  DB_USER: ${MYSQL_USER:-metarang_user}
  DB_PASSWORD: ${MYSQL_PASSWORD:-metarang_password}

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  # Populates the grpc_certs volume from ./certs/grpc on the host, or generates
  # new certificates when GRPC_TLS_ENABLED=true and none are present.
  grpc-certs-init:
    image: docker.arvancloud.ir/alpine:3.21
    environment:
      GRPC_TLS_ENABLED: ${GRPC_TLS_ENABLED:-false}
    volumes:
      - grpc_certs:/certs
      - ${GRPC_CERTS_HOST_DIR:-./certs}:/host-certs:ro
      - ./scripts/docker/generate-grpc-certs.sh:/generate-grpc-certs.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /generate-grpc-certs.sh > /tmp/generate-grpc-certs.sh && exec /bin/sh /tmp/generate-grpc-certs.sh"]
    restart: "no"
    networks:
      - metarang-network
  
  # MySQL Database (shared with the Laravel admin panel via metarang-shared)
  mysql:
    image: docker.arvancloud.ir/mysql:8.0.43
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metarang_db}
      MYSQL_USER: ${MYSQL_USER:-metarang_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-metarang_password}
    # Bind to loopback so local tools work; not reachable from the public internet.
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      metarang-network:
      metarang-shared:
        aliases:
          - metarang-mysql
    command:
      - --host-cache-size=0
      - --pid-file=/tmp/mysqld.pid
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis (for pub/sub and caching). Keep off metarang-shared — the admin panel has its own Redis.
  redis:
    image: docker.arvancloud.ir/redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - metarang-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot SQL migrator (scripts/migrations). Runs before DB-backed services start.
  # Re-apply pending files after pulling new migrations:
  #   docker compose up -d --force-recreate --no-deps migrate
  # or: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: ./scripts/docker/migrate/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-metarang_db}
      # DDL needs elevated privileges; defaults match Make migrate (root).
      DB_USER: ${MIGRATE_DB_USER:-root}
      DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-root_password}}
      APP_ENV: ${APP_ENV:-local}
      MIGRATE_FORCE: ${MIGRATE_FORCE:-0}
      SKIP_MIGRATE: ${SKIP_MIGRATE:-0}
      MIGRATIONS_PATH: /migrations
      MYSQL_WAIT_SECONDS: ${MYSQL_WAIT_SECONDS:-90}
    volumes:
      # Host mount so new SQL files apply without rebuilding the image locally.
      - ./scripts/migrations:/migrations:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - metarang-network
    develop:
      watch:
        - action: rebuild
          path: ./shared/cmd/migrate
        - action: rebuild
          path: ./shared/pkg/migrate
        - action: rebuild
          path: ./scripts/docker/migrate

  # ============================================================================
  # Core Microservices
  # ============================================================================

  # Auth Service - Authentication & User Management
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    # gRPC is internal-only; reachable on metarang-network, not exposed on the host
    env_file:
      - ./services/auth-service/config.env
    environment:
      GRPC_PORT: 50051
      HTTP_PORT: 8066
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      NOTIFICATIONS_SERVICE_ADDR: notifications-service:50058
      LEVELS_SERVICE_ADDR: levels-service:50054
      FEATURES_SERVICE_ADDR: features-service:50053
      COMMERCIAL_SERVICE_ADDR: commercial-service:50052
      <<: [*sentry-environment, *internal-auth, *grpc-tls, *db-environment]
    depends_on:
      <<: [*grpc-certs-depends, *migrate-depends]
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      commercial-service:
        condition: service_healthy
    volumes:
      - *grpc-certs-mount
    networks:
      - metarang-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8066/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    develop:
      watch:
        - action: rebuild
          path: ./services/auth-service
          ignore:
            - "**/_test.go"
            - "**/tmp"
            - "**/.git"
        - action: rebuild
          path: ./shared

  # Commercial Service - Wallets & Transactions
  commercial-service:
    build:
      context: .
      dockerfile: ./services/commercial-service/Dockerfile
    # gRPC/HTTP are internal-only; public API is via Kong on :8000
    env_file:
      - ./services/commercial-service/config.env
    environment:
      GRPC_PORT: 50052
      HTTP_PORT: 8067
      APP_URL: ${APP_URL:-http://localhost:8000}
      AUTH_SERVICE_ADDR: auth-service:50051
      <<: [*sentry-environment, *internal-auth, *grpc-tls, *db-environment]
    depends_on:
      <<: [*grpc-certs-depends, *migrate-depends]
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8067/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - *grpc-certs-mount
    networks:
      - metarang-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./services/commercial-service
