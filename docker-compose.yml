  # Health Check Service - System Health Monitoring
  health-check-service:
    build:
      context: .
      dockerfile: ./services/health-check-service/Dockerfile
    ports:
      - "8090:8090"
    networks:
      - metarang-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Swagger UI - OpenAPI documentation browser
  swagger-ui:
    image: docker.arvancloud.ir/swaggerapi/swagger-ui:v5.18.2
    environment:
      APP_URL: ${APP_URL:-http://localhost:8000}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "8081:8080"
    volumes:
      - ./openapi:/openapi-src:ro
      - ./scripts/swagger-ui-entrypoint.sh:/entrypoint.sh:ro
    networks:
      - metarang-network
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/openapi/openapi.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Kong API Gateway
  kong:
    image: docker.arvancloud.ir/kong:3.9.3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000" # Proxy port (main API endpoint)
      # Admin API listens on 127.0.0.1:8001 inside the container only — not exposed on the host
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
      - ./shared/proto:/kong/protos:ro
    depends_on:
      auth-service:
        condition: service_started
      commercial-service:
        condition: service_started
      features-service:
        condition: service_healthy
      levels-service:
        condition: service_healthy
      dynasty-service:
        condition: service_started
      calendar-service:
        condition: service_started
      support-service:
        condition: service_healthy
      training-service:
        condition: service_started
      notifications-service:
        condition: service_started
      storage-service:
        condition: service_started
      financial-service:
        condition: service_started
      social-service:
        condition: service_started
    networks:
      - metarang-network
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Monitoring Stack
  # ============================================================================

  # Prometheus - Metrics Collection
  prometheus:
    image: docker.arvancloud.ir/prom/prometheus:v2.53.5
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - metarang-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Grafana - Visualization & Dashboards
  grafana:
    image: docker.arvancloud.ir/grafana/grafana:11.6.16
    ports:
      - "3001:3001"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-metarang-local-dev-grafana-password-change-in-production}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3001"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - metarang-network
      - dokploy-network
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter - Host-level infrastructure metrics (CPU, Memory, Disk, Network)
  node-exporter:
    image: docker.arvancloud.ir/prom/node-exporter:v1.11.1
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - metarang-network
    restart: unless-stopped
    healthcheck:
      # Probe / (not /metrics): wget --spider aborts early and node-exporter logs
      # "connection reset by peer" while still writing the large metrics payload.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Note: cAdvisor removed due to Windows/Docker Desktop compatibility issues
  # Node Exporter provides host-level infrastructure metrics (CPU, Memory, Disk, Network)
  # For container-level metrics on Windows, consider using Docker Desktop's built-in metrics

volumes:
  mysql_data:
    driver: local
  grpc_certs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  metarang-network:
    driver: bridge
  # Traefik / Dokploy public routing. Create once locally: docker network create dokploy-network
  dokploy-network:
    external: true
  # Cross-stack MySQL for the admin panel. Create once: docker network create metarang-shared
  metarang-shared:
    name: metarang-shared
    external: true

