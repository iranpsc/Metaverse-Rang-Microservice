      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8062/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    develop:
      watch:
        - action: rebuild
          path: ./services/features-service
          ignore:
            - "**/_test.go"
            - "**/tmp"
            - "**/.git"
        - action: rebuild
          path: ./shared

  # Levels Service - User Progression & Activities
  levels-service:
    build:
      context: .
      dockerfile: ./services/levels-service/Dockerfile
    # gRPC/HTTP are internal-only; public API is via Kong on :8000
    env_file:
      - ./services/levels-service/config.env
    environment:
      GRPC_PORT: 50054
      HTTP_PORT: 8061
      APP_URL: ${APP_URL:-http://localhost:8000}
      <<: [*sentry-environment, *internal-auth, *grpc-tls, *db-environment]
    depends_on:
      <<: [*grpc-certs-depends, *migrate-depends]
      mysql:
        condition: service_healthy
    volumes:
      - *grpc-certs-mount
    networks:
      - metarang-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8061/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - action: rebuild
          path: ./services/levels-service
          ignore:
            - "**/_test.go"
            - "**/tmp"
            - "**/.git"
        - action: rebuild
          path: ./shared

  # Dynasty Service - Family & Dynasty Management (gRPC internal + HTTP for Kong /api/dynasty)
  dynasty-service:
