      start_period: 15s
    depends_on:
      <<: [*grpc-certs-depends, *migrate-depends]
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
      levels-service:
        condition: service_started
      notifications-service:
        condition: service_started
      commercial-service:
        condition: service_started
    volumes:
      - *grpc-certs-mount
    networks:
      - metarang-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./services/dynasty-service
          ignore:
            - "**/_test.go"
            - "**/tmp"
            - "**/.git"
        - action: rebuild
          path: ./shared

  # Calendar Service - Events Management (gRPC internal + HTTP for Kong /api/calendar)
  calendar-service:
