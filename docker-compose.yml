      NOTIFICATION_SERVICE_ADDR: notifications-service:50058
      STORAGE_SERVICE_ADDR: storage-service:8059
      <<: [*sentry-environment, *internal-auth, *grpc-tls, *db-environment]
    depends_on:
      <<: [*grpc-certs-depends, *migrate-depends]
      mysql:
        condition: service_healthy
      notifications-service:
        condition: service_started
      auth-service:
        condition: service_started
      storage-service:
        condition: service_started
    volumes:
      - *grpc-certs-mount
    networks:
      - metarang-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8070/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - action: rebuild
          path: ./services/support-service
          ignore:
            - "**/_test.go"
            - "**/tmp"
            - "**/.git"
        - action: rebuild
          path: ./shared

  # Social Service - Challenge quiz & user follow graph (gRPC internal + HTTP for Kong)
  social-service:
    build:
      context: .
      dockerfile: ./services/social-service/Dockerfile
    # gRPC/HTTP are internal-only; public API is via Kong on :8000
