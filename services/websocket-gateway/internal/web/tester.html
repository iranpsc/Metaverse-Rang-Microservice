<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Gateway Tester</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #1b2430;
      --muted: #5d6b7a;
      --line: #d5dee8;
      --accent: #0e67d0;
      --accent-press: #0b5390;
      --ok-bg: #e7f6ee;
      --ok-text: #0c6b38;
      --ok-line: #b7e4c9;
      --err-bg: #fdeceb;
      --err-text: #a61b12;
      --err-line: #f5c2c0;
      --info-bg: #e8f2fc;
      --info-text: #0b4f93;
      --info-line: #c5daf3;
      --idle-bg: #eef2f6;
      --idle-text: #3d4b5c;
      --log: #0f1722;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 "Segoe UI", Tahoma, sans-serif;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 650;
    }

    .lede {
      margin: 0 0 20px;
      color: var(--muted);
      direction: ltr;
      text-align: right;
    }

    form, .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }

    form { display: grid; gap: 14px; }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
    }

    .hint {
      font-weight: 400;
      color: var(--muted);
      font-size: 0.85rem;
      direction: ltr;
      text-align: right;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      direction: ltr;
      text-align: left;
      background: #fff;
      color: var(--text);
    }

    input:focus {
      outline: 2px solid #9ec5f5;
      border-color: var(--accent);
    }

    input:disabled { background: #f6f8fa; color: #6b7785; }

    #connect {
      justify-self: start;
      min-width: 140px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #connect:hover { background: var(--accent-press); }
    #connect:disabled { opacity: 0.65; cursor: default; }
    #connect.danger { background: #b42318; }
    #connect.danger:hover { background: #8e1b13; }

    .alert {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--idle-bg);
      color: var(--idle-text);
      direction: ltr;
      text-align: right;
    }

    .alert.success { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-line); }
    .alert.failure { background: var(--err-bg); color: var(--err-text); border-color: var(--err-line); }
    .alert.info { background: var(--info-bg); color: var(--info-text); border-color: var(--info-line); }

    .panel { margin-top: 16px; }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 { margin: 0; font-size: 1.05rem; }

    #clear {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }

    #broadcast {
      direction: ltr;
      text-align: left;
      min-height: 220px;
      max-height: 420px;
      overflow: auto;
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      background: var(--log);
      color: #d6e2f0;
      font: 13px/1.45 ui-monospace, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #broadcast:empty::before {
      content: "No broadcasts yet.";
      color: #8ea0b5;
    }
  </style>
</head>
<body>
  <main>
    <h1>WebSocket Gateway Tester</h1>
    <p class="lede">Connect with Socket.IO and watch events from this gateway. Public channels join without a token. The notifications channel is private.</p>

    <form id="tester" autocomplete="off">
      <label>
        WebSocket host
        <input id="host" name="host" type="url" inputmode="url" required placeholder="http://localhost:3002" value="http://localhost:3002">
      </label>

      <label>
        Channel
        <input id="channel" name="channel" list="channels" required placeholder="feature-status" value="feature-status">
        <span class="hint">Public: feature-status, user-status. Private: notifications.</span>
      </label>
      <datalist id="channels">
        <option value="feature-status"></option>
        <option value="user-status"></option>
        <option value="notifications"></option>
      </datalist>

      <label>
        Event
        <input id="event" name="event" list="events" required placeholder="feature-status-changed" value="feature-status-changed">
      </label>
      <datalist id="events">
        <option value="feature-status-changed"></option>
        <option value="user-status-changed"></option>
        <option value="notification-received"></option>
        <option value="connected"></option>
      </datalist>

      <label id="token-field" hidden>
        Token
        <input id="token" name="token" type="password" autocomplete="off" placeholder="Sanctum token">
      </label>

      <button id="connect" type="button">Connect</button>
    </form>

    <div id="alert" class="alert" role="alert">Not connected.</div>

    <section class="panel" aria-labelledby="broadcast-title">
      <div class="panel-head">
        <h2 id="broadcast-title">Broadcast data</h2>
        <button id="clear" type="button">Clear</button>
      </div>
      <pre id="broadcast"></pre>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    const hostInput = document.getElementById("host");
    const channelInput = document.getElementById("channel");
    const eventInput = document.getElementById("event");
    const tokenField = document.getElementById("token-field");
    const tokenInput = document.getElementById("token");
    const connectButton = document.getElementById("connect");
    const alertBox = document.getElementById("alert");
    const broadcast = document.getElementById("broadcast");
    const clearButton = document.getElementById("clear");

    const eventByChannel = {
      "feature-status": "feature-status-changed",
      "user-status": "user-status-changed",
      "notifications": "notification-received"
    };
    const knownEvents = new Set(Object.values(eventByChannel));
    const privateChannels = new Set(["notifications"]);

    let socket = null;
    let connectFailed = false;

    function isPrivateChannel(channel) {
      const name = channel.trim().toLowerCase();
      return privateChannels.has(name) || name.startsWith("user:");
    }

    function syncTokenField() {
      const show = isPrivateChannel(channelInput.value);
      tokenField.hidden = !show;
      tokenInput.required = show;
      if (!show) tokenInput.value = "";
    }

    function suggestEvent() {
      const suggested = eventByChannel[channelInput.value.trim().toLowerCase()];
      const current = eventInput.value.trim();
      if (suggested && (current === "" || knownEvents.has(current))) {
        eventInput.value = suggested;
      }
    }

    function setAlert(kind, message) {
      alertBox.className = "alert " + kind;
      alertBox.textContent = message;
    }

    function setFormLocked(locked) {
      hostInput.disabled = locked;
      channelInput.disabled = locked;
      eventInput.disabled = locked;
      tokenInput.disabled = locked;
    }

    function setConnected(connected) {
      setFormLocked(connected);
      connectButton.disabled = false;
      connectButton.textContent = connected ? "Disconnect" : "Connect";
      connectButton.classList.toggle("danger", connected);
    }

    function appendBroadcast(eventName, payload) {
      let body;
      try {
        body = JSON.stringify(payload, null, 2);
      } catch (err) {
        body = String(payload);
      }
      const block = "[" + new Date().toISOString() + "] " + eventName + "\n" + body + "\n\n";
      broadcast.textContent += block;
      broadcast.scrollTop = broadcast.scrollHeight;
    }

    function closeSocket() {
      if (!socket) return;
      const current = socket;
      socket = null;
      current.removeAllListeners();
      current.disconnect();
    }

    function connect() {
      if (typeof io !== "function") {
        setAlert("failure", "Socket.IO client failed to load. Check network access to cdn.socket.io.");
        return;
      }

      const host = hostInput.value.trim().replace(/\/+$/, "");
      const channel = channelInput.value.trim();
      const eventName = eventInput.value.trim();
      const token = tokenInput.value.trim();

      if (!host || !/^https?:\/\//i.test(host)) {
        setAlert("failure", "Enter a WebSocket host that starts with http:// or https://.");
        return;
      }
      if (!channel) {
        setAlert("failure", "Enter a channel.");
        return;
      }
      if (!eventName) {
        setAlert("failure", "Enter an event name.");
        return;
      }
      if (isPrivateChannel(channel) && !token) {
        setAlert("failure", "A token is required for a private channel.");
        return;
      }

      closeSocket();
      connectFailed = false;
      connectButton.disabled = true;
      connectButton.textContent = "Connecting…";
      setAlert("info", "Connecting to " + host + "…");

      const options = {
        path: "/socket.io/",
        transports: ["websocket", "polling"],
        reconnection: false
      };
      if (isPrivateChannel(channel)) {
        options.auth = { token: token };
        options.query = { token: token };
      }

      const next = io(host, options);
      socket = next;

      next.on("connect", function () {
        setConnected(true);
        setAlert("success", "Connected to " + host + ".");
      });

      next.on("connected", function (data) {
        const authenticated = data && data.authenticated;
        const userId = data && data.userId;
        let message = authenticated ? "Connected and authenticated" : "Connected (public channels only)";
        if (userId != null && userId !== "") message += " as user " + userId;
        message += ". Listening for " + eventName + ".";
        setAlert("success", message);
      });

      next.on(eventName, function (payload) {
        appendBroadcast(eventName, payload);
      });

      next.on("connect_error", function (err) {
        connectFailed = true;
        const message = (err && (err.message || err.data && err.data.message)) || "Connection failed.";
        setAlert("failure", message);
        setConnected(false);
        closeSocket();
      });

      next.on("disconnect", function (reason) {
        if (socket !== next || connectFailed) return;
        setConnected(false);
        if (reason && reason !== "io client disconnect") {
          setAlert("failure", "Disconnected: " + reason);
        }
      });
    }

    function disconnect() {
      connectFailed = false;
      closeSocket();
      setConnected(false);
      setAlert("info", "Disconnected.");
    }

    channelInput.addEventListener("input", function () {
      syncTokenField();
      suggestEvent();
    });

    document.getElementById("tester").addEventListener("submit", function (e) {
      e.preventDefault();
    });

    connectButton.addEventListener("click", function () {
      if (socket && socket.connected) {
        disconnect();
        return;
      }
      connect();
    });

    clearButton.addEventListener("click", function () {
      broadcast.textContent = "";
    });

    const origin = window.location.origin;
    if (origin && origin !== "null" && /^https?:\/\//i.test(origin)) {
      hostInput.value = origin;
    }
    syncTokenField();
  </script>
</body>
</html>
