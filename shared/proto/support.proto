syntax = "proto3";

package support;

import "common.proto";

option go_package = "metarang/shared/pb/support";

// TicketService handles support tickets
service TicketService {
  rpc CreateTicket(CreateTicketRequest) returns (TicketResponse);
  rpc GetTickets(GetTicketsRequest) returns (TicketsResponse);
  rpc GetTicket(GetTicketRequest) returns (TicketResponse);
  rpc UpdateTicket(UpdateTicketRequest) returns (TicketResponse);
  rpc AddResponse(AddResponseRequest) returns (TicketResponse);
  rpc CloseTicket(CloseTicketRequest) returns (TicketResponse);
}

// ReportService handles user reports
service ReportService {
  rpc CreateReport(CreateReportRequest) returns (ReportResponse);
  rpc GetReports(GetReportsRequest) returns (ReportsResponse);
  rpc GetReport(GetReportRequest) returns (ReportResponse);
}

// UserEventReportService handles user event reports
service UserEventReportService {
  rpc CreateUserEvent(CreateUserEventRequest) returns (UserEventResponse);
  rpc GetUserEvents(GetUserEventsRequest) returns (UserEventsResponse);
  rpc GetUserEvent(GetUserEventRequest) returns (UserEventResponse);
  rpc ReportUserEvent(ReportUserEventRequest) returns (UserEventReportResponse);
  rpc SendEventReportResponse(SendEventReportResponseRequest) returns (SendEventReportResponseReply);
  rpc CloseUserEventReport(CloseUserEventReportRequest) returns (common.Empty);
}

// NoteService handles personal notes
service NoteService {
  rpc CreateNote(CreateNoteRequest) returns (NoteResponse);
  rpc GetNotes(GetNotesRequest) returns (NotesResponse);
  rpc GetNote(GetNoteRequest) returns (NoteResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (NoteResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (common.Empty);
}

// Messages

// Ticket Messages
message CreateTicketRequest {
  uint64 user_id = 1;
  string title = 2;
  string content = 3;
  string attachment = 4; // URL or empty
  uint64 receiver_id = 5; // optional
  string department = 6;
}

message UpdateTicketRequest {
  uint64 ticket_id = 1;
  uint64 user_id = 2;
  string title = 3;
  string content = 4;
  string attachment = 5;
}

message AddResponseRequest {
  uint64 ticket_id = 1;
  uint64 user_id = 2;
  string response = 3;
  string attachment = 4; // URL or empty
  string user_name = 5; // display name of responder (from gateway/auth)
}

message CloseTicketRequest {
  uint64 ticket_id = 1;
  uint64 user_id = 2;
}

message GetTicketsRequest {
  uint64 user_id = 1;
  common.PaginationRequest pagination = 2;
  int32 status_filter = 3; // optional, 0=all
  bool received = 4;
}

message GetTicketRequest {
  uint64 ticket_id = 1;
  uint64 user_id = 2; // for authorization
}

message TicketResponse {
  uint64 id = 1;
  string title = 2;
  string content = 3;
  string attachment = 4;
  int32 code = 5; // 6-digit code
  string department = 6;
  int32 status = 7; // 0=NEW, 1=ANSWERED, 2=RESOLVED, 3=UNRESOLVED, 4=TRACKING, 5=CLOSED
  int32 importance = 8;
  common.UserBasic sender = 9;
  common.UserBasic receiver = 10;
  repeated TicketResponseItem responses = 11;
  string created_at = 12; // Jalali formatted
  string updated_at = 13; // Jalali formatted
  repeated TicketResponseItem messages = 14; // chat thread: opening + replies, oldest first
  uint64 current_user_id = 15; // viewer used to compute is_mine
}

message TicketsResponse {
  repeated TicketResponse tickets = 1;
  common.PaginationMeta pagination = 2;
}

message TicketResponseItem {
  uint64 id = 1;
  uint64 ticket_id = 2;
  string response = 3;
  string attachment = 4;
  string responser_name = 5;
  uint64 responser_id = 6;
  string created_at = 7; // Jalali formatted
  common.UserBasic author = 8;
  string role = 9; // sender, receiver, staff
  bool is_mine = 10; // relative to current_user_id
  string kind = 11; // opening, reply
}

// Report Messages
message CreateReportRequest {
  uint64 user_id = 1;
  string reportable_type = 2;
  uint64 reportable_id = 3;
  string reason = 4;
  string description = 5;
  string url = 6;
  repeated string image_paths = 7; // relative storage paths, e.g. reports/file.png
}

message GetReportsRequest {
  uint64 user_id = 1;
  common.PaginationRequest pagination = 2;
}

message GetReportRequest {
  uint64 report_id = 1;
  uint64 user_id = 2;
}

message ReportResponse {
  uint64 id = 1;
  uint64 user_id = 2;
  string reportable_type = 3;
  uint64 reportable_id = 4;
  string reason = 5;
  string description = 6;
  string created_at = 7; // Jalali formatted
  string url = 8;
  repeated string image_paths = 9; // relative storage paths
}

message ReportsResponse {
  repeated ReportResponse reports = 1;
  common.PaginationMeta pagination = 2;
}

// User Event Report Messages
message CreateUserEventRequest {
  uint64 user_id = 1;
  string title = 2;
  string description = 3;
  string event_date = 4; // Jalali date
}

message GetUserEventsRequest {
  uint64 user_id = 1;
  common.PaginationRequest pagination = 2;
}

message GetUserEventRequest {
  uint64 event_id = 1;
  uint64 user_id = 2;
}

message UserEventReportResponseItem {
  uint64 id = 1;
  string responser_name = 2;
  string response = 3;
  string date = 4; // Jalali Y/m/d
  string time = 5; // H:M:S
}

message UserEventReportDetail {
  uint64 id = 1;
  string suspicious_citizen = 2;
  string event_description = 3;
  int32 status = 4;
  bool closed = 5;
  string date = 6;
  string time = 7;
  repeated UserEventReportResponseItem responses = 8;
}

message UserEventResponse {
  uint64 id = 1;
  uint64 user_id = 2;
  string title = 3;
  string description = 4;
  string event_date = 5; // Jalali formatted
  string created_at = 6; // Jalali formatted
  string ip = 7;
  string device = 8;
  bool status_ok = 9;
  UserEventReportDetail report = 10; // set on GetUserEvent (show)
}

message UserEventsResponse {
  repeated UserEventResponse events = 1;
  common.PaginationMeta pagination = 2;
}

message ReportUserEventRequest {
  uint64 event_id = 1;
  uint64 reporter_id = 2;
  string suspicious_citizen = 3;
  string event_description = 4;
}

message UserEventReportResponse {
  uint64 id = 1;
  uint64 event_id = 2;
  string suspicious_citizen = 3;
  string event_description = 4;
  string created_at = 5; // Jalali formatted
}

message SendEventReportResponseRequest {
  uint64 event_id = 1;
  uint64 responder_id = 2;
  string response = 3;
  string responder_name = 4;
}

message SendEventReportResponseReply {
  uint64 id = 1;
  string responser_name = 2;
  string response = 3;
  string date = 4; // Jalali Y/m/d
  string time = 5; // H:M:S
}

message CloseUserEventReportRequest {
  uint64 event_id = 1;
  uint64 user_id = 2;
}

// Note Messages
message CreateNoteRequest {
  uint64 user_id = 1;
  string title = 2;
  string content = 3;
  repeated string attachments = 4;
}

message UpdateNoteRequest {
  uint64 note_id = 1;
  uint64 user_id = 2;
  string title = 3;
  string content = 4;
  repeated string attachments = 5; // replaces full list when non-empty
}

message GetNotesRequest {
  uint64 user_id = 1;
}

message GetNoteRequest {
  uint64 note_id = 1;
  uint64 user_id = 2; // for authorization
}

message DeleteNoteRequest {
  uint64 note_id = 1;
  uint64 user_id = 2; // for authorization
}

message NoteResponse {
  uint64 id = 1;
  string title = 2;
  string content = 3;
  repeated string attachments = 4;
  string date = 5; // Jalali formatted date (Y/m/d)
  string time = 6; // Jalali formatted time (H:m:s)
}

message NotesResponse {
  repeated NoteResponse notes = 1;
}

